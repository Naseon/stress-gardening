<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stress Gardening Analysis</title>
  <style>
    :root {
      --ink: #151515;
      --line: rgba(21, 21, 21, 0.1);
      --line-strong: rgba(21, 21, 21, 0.16);
      --surface: #fafaf7;
      --nav-h: clamp(48px, 3.15vw, 60px);
      --page-pad: clamp(28px, 3vw, 48px);
      --grid-w: min(1450px, calc(100% - clamp(32px, 4vw, 72px)));
      --card-gap: clamp(10px, 1.15vw, 14px);
      --tile-size: clamp(240px, 18vw, 280px);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #fff;
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    img {
      display: block;
      max-width: 100%;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      width: 100%;
      max-width: 2754px;
      aspect-ratio: 2754 / 85;
      margin: 0 auto;
      overflow: hidden;
      background: #fff;
    }

    .topbar__image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      pointer-events: none;
      user-select: none;
    }

    .topbar__link {
      position: absolute;
      top: 0;
      bottom: 0;
      display: block;
      z-index: 2;
    }

    .topbar__link--brand {
      left: 0;
      width: 19.0995%;
      border-right: 1px solid rgba(23, 23, 21, 0.18);
    }

    .topbar__link--shop {
      left: 19.0995%;
      width: 57.6993%;
    }

    .topbar__link--bag {
      left: 76.7988%;
      width: 8.3138%;
      border-left: 1px solid rgba(23, 23, 21, 0.18);
      border-right: 1px solid rgba(23, 23, 21, 0.18);
    }

    .topbar__link--about {
      left: 85.1126%;
      width: 14.8874%;
    }

    .analysis-page {
      position: relative;
      min-height: calc(100vh - var(--nav-h));
      padding: clamp(72px, 7vw, 92px) 0 clamp(56px, 6vw, 80px);
      background:
        linear-gradient(to right, transparent 0, transparent calc(var(--tile-size) - 1px), var(--line) calc(var(--tile-size) - 1px), var(--line) var(--tile-size)),
        linear-gradient(to bottom, transparent 0, transparent calc(var(--tile-size) - 1px), var(--line) calc(var(--tile-size) - 1px), var(--line) var(--tile-size));
      background-size: var(--tile-size) var(--tile-size);
      background-position: 34px 0;
    }

    .analysis-shell {
      width: var(--grid-w);
      margin: 0 auto;
    }

    .analysis-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: var(--card-gap);
    }

    .analysis-card {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .analysis-card__button {
      appearance: none;
      border: 0;
      background: transparent;
      padding: 0;
      text-align: left;
      cursor: pointer;
      color: inherit;
      font: inherit;
      transition: transform 0.22s ease, box-shadow 0.22s ease;
    }

    .analysis-card__button:hover,
    .analysis-card__button:focus-visible {
      transform: translateY(-3px);
      outline: none;
    }

    .analysis-card__button:hover .analysis-card__inner,
    .analysis-card__button:focus-visible .analysis-card__inner {
      box-shadow: inset 0 0 0 1px var(--line-strong);
    }

    .analysis-card__index {
      display: block;
      margin: 0 0 8px;
      font-size: 12px;
      line-height: 1;
      color: rgba(21, 21, 21, 0.8);
    }

    .analysis-card__inner {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: clamp(300px, 24vw, 354px);
      background: var(--surface);
      padding: 14px 14px 16px;
      box-shadow: inset 0 0 0 1px rgba(21, 21, 21, 0.03);
    }

    .analysis-card__visual {
      position: relative;
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      padding: clamp(22px, 2.4vw, 34px);
    }

    .analysis-card__visual img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
    }

    .analysis-card__name {
      margin: 12px 0 0;
      font-size: 12px;
      line-height: 1.2;
      color: rgba(21, 21, 21, 0.88);
    }

    .analysis-card__hint {
      position: absolute;
      right: 14px;
      bottom: 14px;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(21, 21, 21, 0.34);
      opacity: 0;
      transition: opacity 0.22s ease;
    }

    .analysis-card__button:hover .analysis-card__hint,
    .analysis-card__button:focus-visible .analysis-card__hint {
      opacity: 1;
    }

    @media (max-width: 1200px) {
      .analysis-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 720px) {
      .analysis-page {
        padding-top: 44px;
        background-position: 18px 0;
      }

      .analysis-grid {
        grid-template-columns: 1fr;
      }

      .analysis-card__inner {
        min-height: 280px;
      }
    }
  </style>
</head>
<body>
  <nav class="topbar" aria-label="Site navigation">
    <img src="./assets/Group 29.png" alt="Stress Gardening top bar" class="topbar__image">
    <a class="topbar__link topbar__link--brand" href="#" aria-label="Stress Gardening" data-route="home"></a>
    <a class="topbar__link topbar__link--shop" href="#" aria-label="Shop" data-route="shop"></a>
    <a class="topbar__link topbar__link--bag" href="#" aria-label="Bag" data-route="bag"></a>
    <a class="topbar__link topbar__link--about" href="#" aria-label="About Project" data-route="about"></a>
  </nav>

  <main class="analysis-page">
    <div class="analysis-shell">
      <section class="analysis-grid" aria-label="Stress analysis levels">
        <article class="analysis-card">
          <button class="analysis-card__button" type="button" data-score="12" data-level="1" aria-label="Thorn Mug Level 1">
            <span class="analysis-card__index">Lv.1</span>
            <div class="analysis-card__inner">
              <div class="analysis-card__visual">
                <img src="./assets/thorn_mug_lv1.png" alt="Thorn Mug Level 1">
                <span class="analysis-card__hint">Enter Lab</span>
              </div>
              <p class="analysis-card__name">Thorn Mug</p>
            </div>
          </button>
        </article>

        <article class="analysis-card">
          <button class="analysis-card__button" type="button" data-score="38" data-level="2" aria-label="Thorn Mug Level 2">
            <span class="analysis-card__index">Lv.2</span>
            <div class="analysis-card__inner">
              <div class="analysis-card__visual">
                <img src="./assets/thorn_mug_lv2.png" alt="Thorn Mug Level 2">
                <span class="analysis-card__hint">Enter Lab</span>
              </div>
              <p class="analysis-card__name">Thorn Mug</p>
            </div>
          </button>
        </article>

        <article class="analysis-card">
          <button class="analysis-card__button" type="button" data-score="63" data-level="3" aria-label="Thorn Mug Level 3">
            <span class="analysis-card__index">Lv.3</span>
            <div class="analysis-card__inner">
              <div class="analysis-card__visual">
                <img src="./assets/thorn_mug_lv3.png" alt="Thorn Mug Level 3">
                <span class="analysis-card__hint">Enter Lab</span>
              </div>
              <p class="analysis-card__name">Thorn Mug</p>
            </div>
          </button>
        </article>

        <article class="analysis-card">
          <button class="analysis-card__button" type="button" data-score="88" data-level="4" aria-label="Thorn Mug Level 4">
            <span class="analysis-card__index">Lv.4</span>
            <div class="analysis-card__inner">
              <div class="analysis-card__visual">
                <img src="./assets/thorn_mug_lv4.png" alt="Thorn Mug Level 4">
                <span class="analysis-card__hint">Enter Lab</span>
              </div>
              <p class="analysis-card__name">Thorn Mug</p>
            </div>
          </button>
        </article>

        <article class="analysis-card">
          <button class="analysis-card__button" type="button" data-score="12" data-level="1" aria-label="Thorn Mirror Level 1">
            <span class="analysis-card__index">Lv.1</span>
            <div class="analysis-card__inner">
              <div class="analysis-card__visual">
                <img src="./assets/thorn_mirror_lv1.png" alt="Thorn Mirror Level 1">
                <span class="analysis-card__hint">Enter Lab</span>
              </div>
              <p class="analysis-card__name">Thorn Mirror</p>
            </div>
          </button>
        </article>

        <article class="analysis-card">
          <button class="analysis-card__button" type="button" data-score="38" data-level="2" aria-label="Thorn Mirror Level 2">
            <span class="analysis-card__index">Lv.2</span>
            <div class="analysis-card__inner">
              <div class="analysis-card__visual">
                <img src="./assets/thorn_mirror_lv2.png" alt="Thorn Mirror Level 2">
                <span class="analysis-card__hint">Enter Lab</span>
              </div>
              <p class="analysis-card__name">Thorn Mirror</p>
            </div>
          </button>
        </article>

        <article class="analysis-card">
          <button class="analysis-card__button" type="button" data-score="63" data-level="3" aria-label="Thorn Mirror Level 3">
            <span class="analysis-card__index">Lv.3</span>
            <div class="analysis-card__inner">
              <div class="analysis-card__visual">
                <img src="./assets/thorn_mirror_lv3.png" alt="Thorn Mirror Level 3">
                <span class="analysis-card__hint">Enter Lab</span>
              </div>
              <p class="analysis-card__name">Thorn Mirror</p>
            </div>
          </button>
        </article>

        <article class="analysis-card">
          <button class="analysis-card__button" type="button" data-score="88" data-level="4" aria-label="Thorn Mirror Level 4">
            <span class="analysis-card__index">Lv.4</span>
            <div class="analysis-card__inner">
              <div class="analysis-card__visual">
                <img src="./assets/thorn_mirror_lv4.png" alt="Thorn Mirror Level 4">
                <span class="analysis-card__hint">Enter Lab</span>
              </div>
              <p class="analysis-card__name">Thorn Mirror</p>
            </div>
          </button>
        </article>
      </section>
    </div>
  </main>

  <script>
    const parentOrigin = window.location.origin === "null" ? "*" : window.location.origin;

    function sendToParent(type, detail = {}) {
      window.parent.postMessage({ type, ...detail }, parentOrigin);
    }

    document.querySelectorAll("[data-route]").forEach((link) => {
      link.addEventListener("click", (event) => {
        event.preventDefault();
        sendToParent("sg-analysis-route", { route: link.dataset.route });
      });
    });

    document.querySelectorAll(".analysis-card__button").forEach((button) => {
      button.addEventListener("click", () => {
        const score = Number(button.dataset.score || 0);
        sendToParent("sg-analysis-complete", {
          payload: {
            stressScore: score,
            score,
            duration: 0,
            wpm: 0,
            errRate: 0,
          },
        });
      });
    });
  </script>
</body>
</html>
