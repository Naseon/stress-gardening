<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fake Goods Company — Stress Gardening</title>

  <!-- Design System -->
  <link rel="stylesheet" href="./styles/base.css" />
  <link rel="stylesheet" href="./styles/layout.css" />
  <link rel="stylesheet" href="./styles/components.css" />
</head>
<body>
<main class="app">

  <!-- ── 1. STAGE ── -->
  <section class="stage" id="garden">
    <div  class="brand"    id="js-brand"></div>
    <canvas id="thornCanvas" aria-label="가시덤불 성장 및 정리 모션"></canvas>
    <aside class="side-panel" id="js-side-panel">
      <nav  class="site-nav" id="js-nav" aria-label="주요 섹션"></nav>
      <section class="toolbox" id="js-toolbox"></section>
      <section class="panel"   id="js-panel"></section>
    </aside>
  </section>

  <!-- ── 2. TICKER ── -->
  <div class="ticker" aria-hidden="true" id="js-ticker"></div>

  <!-- ── 3. COLLECTION ── -->
  <section class="collection" id="collection">
    <div class="section-heading" id="js-collection-heading"></div>
    <div class="product-grid"   id="js-collection-grid"></div>
  </section>

  <!-- ── 4. ARCHIVE ── -->
  <section class="image-band" id="archive">
    <div class="section-heading" id="js-archive-heading"></div>
    <div class="mood-board"      id="js-moodboard" aria-label="Stress Gardening mood board"></div>
  </section>

  <!-- ── 5. SPLIT FEATURE ── -->
  <section class="split-feature" id="js-feature"></section>

  <!-- ── 6. TOOL GRID ── -->
  <section class="tool-grid" id="tools">
    <div class="section-heading" id="js-tools-heading"></div>
    <div class="tool-layout">
      <div class="tool-panel thorn-rules"  aria-hidden="true"></div>
      <div class="tool-panel chrome-tools" aria-hidden="true"></div>
    </div>
  </section>

  <!-- ── 7. PROCESS ── -->
  <section class="process" id="process">
    <div class="process-title" id="js-process-title"></div>
    <ol                        id="js-process-list"></ol>
  </section>

  <!-- ── 8. PRESERVE ── -->
  <section class="preserve" id="js-preserve"></section>

  <!-- ── 9. FOOTER ── -->
  <footer class="footer" id="js-footer"></footer>

</main>

<!-- 순서 중요: three → config → render → game -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="./content/config.js"></script>
<script src="./content/render.js"></script>
<script src="./game/app.js"></script>
</body>
</html>
